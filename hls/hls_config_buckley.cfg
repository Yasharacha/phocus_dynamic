# SINGLE-FLUX (Buckley-Leverett, flux_id 4 compiled in) variant of hls_config.cfg.
# Chosen because its f'(u) is the heaviest of the 7 fluxes on the CPU check path: a division
# plus ~6-7 surrounding multiplies/adds, vs a trivial |u| for Burgers. The FPGA pipeline stays
# fast regardless of the formula, so this is the flux most likely to make check_cpu genuinely
# exceed the FPGA path's fixed overhead (flush+launch), which is what beat the FPGA on Burgers.
# Use --work_dir hls_out_buckley_wide (does not overwrite other results). Clock target 150 MHz.
# Vitis 2025.1 unified-flow HLS config for tv_cfl_kernel on the Ultra96 (ZU3EG).
# Paths are relative to this file.
#   C-sim  : vitis-run --mode hls --csim   --config hls_config.cfg --work_dir hls_out
#   C-synth: vitis-run --mode hls --csynth --config hls_config.cfg --work_dir hls_out
#   Package: vitis-run --mode hls --package --config hls_config.cfg --work_dir hls_out
part=xczu3eg-sbva484-1-e

[hls]
flow_target=vivado
syn.top=tv_cfl_kernel
syn.file=tv_cfl_kernel.cpp
syn.file=tv_cfl_kernel.hpp
syn.file=flux_functions.hpp
tb.file=tb_tv_cfl.cpp
syn.cflags=-DTV_CFL_FIXED_FLUX=4
tb.cflags=-DTV_CFL_FIXED_FLUX=4
# 150 MHz target, same as the proven wide150 Burgers build
clock=6.67ns
syn.rtl.deadlock_detection=none
package.output.format=ip_catalog
package.output.syn=false
