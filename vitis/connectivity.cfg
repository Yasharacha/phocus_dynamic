# connectivity.cfg
# Assigns each AXI4 master port of the kernel to a DDR bank on the Alveo card.
#
# gmem0 (port u      ) → DDR bank 0  — large sequential read
# gmem1 (port results) → DDR bank 1  — 2-element write, kept separate to avoid
#                                       bank contention with the read burst
#
# Adjust bank indices if your card has fewer DDR banks (e.g. U50 HBM uses
# HBM[0:31] notation instead of DDR[0:3]).

[connectivity]
sp=tv_cfl_kernel_1.m_axi_gmem0:DDR[0]
sp=tv_cfl_kernel_1.m_axi_gmem1:DDR[1]
